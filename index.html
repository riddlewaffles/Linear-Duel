<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linear Duel</title>
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <aside id="sidebar">
        <h2 id="turn-indicator">Player 1</h2>
        
        <div class="input-group">
            <label for="functionInput">f(x) = </label>
            <input type="text" id="functionInput" placeholder="e.g. 2*x + 5" autofocus>
            <button id="fireBtn">Fire</button>
        </div>

        <div class="hint">
            <strong>Supported:</strong><br>
            x, +, -, *, /, ^, sin(), cos(), tan(), sqrt(), abs()
        </div>

        <div id="coord-info" class="coord-display">Hover over a player to see coordinates</div>
    </aside>

    <main id="game-container">
        <canvas id="gameCanvas"></canvas>
    </main>

    <script src="script.js"></script>
</body>
</html>
