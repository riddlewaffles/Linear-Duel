<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function Duel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="icon.png">
</head>
<body>
    <div id="game-container">
        <div id="turn-indicator">Player 1's Turn</div>

        <canvas id="gameCanvas" width="600" height="600"></canvas>

        <div id="controls">
            <div class="input-group">
                <label for="functionInput">f(x) = </label>
                <input type="text" id="functionInput" placeholder="Enter a function of x" value="">
                <button id="fireBtn">Beam</button>
            </div>

            <div class="hint">
                Supported: x, +, -, *, /, ^, sin(), cos(), tan(), sqrt(), abs()
            </div>
        </div>
    </div>

    <div id="footer">
        // Linear Duel
        <br>
        // Created by: @riddlewaffles @eeva_thething
        <br>
        // GitHub: <a href="https://github.com/riddlewaffles" target="_blank">https://github.com/riddlewaffles</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
